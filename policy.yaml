allowlist:
  origins:
    - "http://localhost:4173"
    # Tenant B (SPEC §12) mock-app instance, run with TENANT=b PORT=4174 — a separate
    # process/port from tenant A's default 4173 (see .env's PORT var and
    # src/replay/tenantOverride.ts). Routes below already listed "/portal/**" before this
    # origin was added; without this origin GuardedSurface's isUrlAllowed (src/guardrails/
    # policy.ts) rejects every navigate to it regardless of the route allowlist.
    - "http://localhost:4174"
  routes:
    - "/"
    - "/login"
    - "/members/**"
    - "/member/**"
    - "/portal/**"
  actions:
    - "click"
    - "fill"
    - "select_option"
    - "navigate"
    - "wait_for"
    - "extract"

risk:
  irreversible_when:
    button_text_matches:
      - "submit"
      - "confirm"
      - "open account"
      - "transfer"
      - "delete"
      - "close"
    method_is:
      - "POST"
  irreversible_policy: "escalate"

redaction:
  patterns:
    - name: "ssn"
      regex: "\\b\\d{3}-\\d{2}-\\d{4}\\b"
    - name: "acct"
      regex: "\\b\\d{9,16}\\b"
    - name: "email"
      regex: "[\\w.+-]+@[\\w-]+\\.[\\w.]+"
